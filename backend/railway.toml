# Railway preview deploy for the Django API. See DEPLOYMENT.md.
#
# In this repo Railway does not find this file on its own: in the backend
# service's settings, set Root Directory to /backend and Config File Path to
# /backend/railway.toml.

[build]
builder = "RAILPACK"

[deploy]
# Runs before each deploy goes live: brings the database schema up to date,
# then loads the five pathways and the starter resources (safe to repeat, it
# rewrites the same rows; resources added in admin are left alone).
# If it fails, the deploy stops and the previous one keeps running.
preDeployCommand = "sh -c 'python manage.py migrate --noinput && python manage.py loaddata pathways resources'"

# gunicorn rather than the Django dev server. Railway sets $PORT, and [::]
# listens on both IPv4 and IPv6.
startCommand = 'gunicorn config.wsgi --bind "[::]:$PORT" --workers 2 --access-logfile -'

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
