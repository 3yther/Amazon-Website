Tv=[{title:"Nine weeks inside a team",text:"Amazon's T Level lead describes students as completely embedded: you learn the tools, sit with the team and contribute to real work."},{title:"Skills hubs and group projects",text:"The programme mixes 15 day stints in Amazon's skills hubs with group projects on charitable causes and individual team challenges."},{title:"Three people looking after you",text:"Every student gets a buddy, a mentor and a placement manager, so there is always someone to ask."},{title:"Growing year on year",text:"Amazon started with Digital placements and has said it is widening the programme into creative, business and engineering pathways."}],xv=[{grade:"Distinction*",points:"168"},{grade:"Distinction",points:"144"},{grade:"Merit",points:"120"},{grade:"Pass, with C or above in the core",points:"96"},{grade:"Pass, with D or E in the core",points:"72"}],Nv=["You are 16 to 19 and finishing your GCSEs, or you are moving on from another course.","You have a rough idea of the industry you want to work in, even if not the exact job.","You learn better by doing than by revising.","You want a qualification employers recognise without giving up the option of university.","You are ready to give one subject area two years. If you want to keep five subjects open, A levels may suit you better."],Av=[{title:"Real work, not a mock-up",text:"At least 315 hours inside a working team, roughly 45 days, doing tasks the employer actually needs done."},{title:"Counts like three A levels",text:"A T Level is broadly the same size as three A levels and carries UCAS points, so university stays open to you."},{title:"Built with employers",text:"Employers helped write the content, so what you learn is what the industry uses."},{title:"Three ways out",text:"Skilled work, a higher or degree apprenticeship, or university. Many employers keep students on at the end."}],zv=["The course itself is free if you are 16 to 18 and in full-time education.","The 16 to 19 Bursary Fund can help with travel, books, equipment and specialist clothing.","The vulnerable student bursary is worth up to 1,200 pounds a year for students in care, care leavers, and some students on Universal Credit, Income Support, DLA or PIP.","Everyone else can apply to their school or college for a discretionary bursary. There is no set amount, so ask what yours offers.","Bursaries cannot cover rent, bills or general living costs."],Nt=[{slug:"digital",name:"Digital",summary:"Build, run and support technology.",tLevels:["Digital Data Analytics","Digital Software Development","Digital Support and Security"],placement:"You sit with a technical team and work on live tasks: writing and reviewing code, testing, fixing bugs, or keeping systems and users running.",suits:"People who like solving a problem and seeing it work straight away.",amazonStatus:"Where Amazon's T Level programme started."},{slug:"business",name:"Business",summary:"Keep teams and operations running.",tLevels:["Management and Administration"],placement:"You support the day to day running of a team: planning, coordinating, handling data and reporting, and keeping processes on track.",suits:"People who are organised and like making things run properly.",amazonStatus:"Named by Amazon as a pathway it is expanding into."},{slug:"media",name:"Media",summary:"Plan, make and publish content.",tLevels:["Media, Broadcast and Production"],placement:"You help plan and produce content, from filming and editing to publishing, and see how a piece goes from idea to audience.",suits:"People who want to make things other people will watch or read.",amazonStatus:"Named by Amazon as a creative pathway it is expanding into."},{slug:"finance",name:"Finance",summary:"Work with the numbers behind decisions.",tLevels:["Accounting","Finance, last enrolments September 2026"],placement:"You work with real figures: tracking spend, checking records, and helping put together the reports a team makes decisions from.",suits:"People who are comfortable with numbers and spotting what is off.",amazonStatus:null},{slug:"engineering",name:"Engineering",summary:"Design, build and maintain systems.",tLevels:["Design and Development for Engineering and Manufacturing","Maintenance, Installation and Repair for Engineering and Manufacturing","Engineering, Manufacturing, Processing and Control"],placement:"You work alongside engineers on equipment and systems: setting up, maintaining, testing and improving how they run.",suits:"People who want to understand how a physical thing works, then make it work better.",amazonStatus:"Named by Amazon as a pathway it is expanding into."}],Ov=[{id:"apprenticeship",question:"Is a T Level the same as an apprenticeship?",answer:"No, they are the other way round. An apprenticeship is mostly paid work with some study. A T Level is mostly study, about 80 percent, with an industry placement of at least 315 hours making up the rest."},{id:"entry",question:"What GCSEs do I need?",answer:"Entry requirements are set by each school or college, not nationally. Around four or five GCSEs at grade 4 or above, usually including English and maths, is common. Check with the provider you want to go to."},{id:"choice",question:"Which T Level subjects can I choose from?",answer:"Around 20, across routes including digital, engineering, construction, health, science, legal and accounting, media, marketing, agriculture, animal care, education, and craft and design. Sport and Social Care arrive in September 2028. The Finance T Level takes its last enrolments in September 2026, so Accounting is the one continuing."},{id:"assessed",question:"How am I assessed?",answer:"Two parts. The core is graded A star to E and covers the knowledge for your industry. The occupational specialism is graded pass, merit or distinction and is the practical side. Both show on your certificate, along with one overall grade."},{id:"university",question:"Can I still go to university?",answer:"Yes. A Distinction star is worth 168 UCAS points, a Distinction 144, a Merit 120 and a Pass 72 or 96 depending on your core grade. Not every university uses UCAS points though, so check the entry requirements of the course you want."},{id:"fail",question:"What if I do not pass everything?",answer:"You get a T Level statement of achievement instead of the full certificate. It lists the parts you did complete, so the work is not lost."},{id:"placement",question:"How long is the industry placement?",answer:"At least 315 hours, roughly 45 days. It can be one or two days a week, a full-time block, or a mix. Amazon runs its placements as a nine week block."},{id:"paid",question:"Do I get paid on placement?",answer:"There is no legal requirement for a placement to be paid. Some employers pay, some cover travel or meals, some do neither. Ask your provider what the arrangement is before you start."},{id:"money",question:"Can I get help with travel or equipment?",answer:"Yes, through the 16 to 19 Bursary Fund. It can cover travel, books, equipment and specialist clothing. Apply through your school or college."},{id:"not-ready",question:"What if I am not ready for a T Level yet?",answer:"There is a T Level Foundation Year, a one year level 2 course that builds up your English, maths, digital skills and work experience first, then moves you onto the T Level."},{id:"alongside",question:"Can I take other qualifications alongside it?",answer:"A T Level is a full time programme broadly the size of three A levels, so it is not usually combined with much else. Some providers allow one extra qualification. Ask yours."}],Sl=[{id:"learning",question:"How do you learn best?",options:[{value:"doing",label:"By doing the thing, then asking why",score:2},{value:"mix",label:"A bit of both",score:1},{value:"reading",label:"By reading, writing it up and revising",score:0}]},{id:"direction",question:"Do you know what kind of work you want?",options:[{value:"clear",label:"I have a fair idea of the industry",score:2},{value:"rough",label:"A rough area, not the job",score:1},{value:"open",label:"No idea yet",score:0}]},{id:"placement",question:"How do you feel about 45 days in a real workplace?",options:[{value:"keen",label:"That is the part I want",score:2},{value:"nervous",label:"Nervous, but up for it",score:1},{value:"rather-not",label:"I would rather stay in the classroom",score:0}]},{id:"assessment",question:"Which way of being assessed suits you?",options:[{value:"project",label:"Exams plus a graded practical specialism",score:2},{value:"mixed",label:"I do not mind either way",score:1},{value:"exams",label:"Written exams only",score:0}]},{id:"next",question:"What do you want to do after the course?",options:[{value:"work",label:"Skilled work or a degree apprenticeship",score:2},{value:"both",label:"Keep work and university both open",score:1},{value:"degree",label:"A degree in something unrelated to this area",score:0}]},{id:"commit",question:"Are you ready to commit to one subject area for two years?",options:[{value:"yes",label:"Yes",score:2},{value:"think-so",label:"I think so",score:1},{value:"no",label:"I want to keep my options wide",score:0}]}],Cv=[{minScore:9,heading:"A T Level looks like a strong fit",text:"You want hands-on learning, real workplace time and a clear route into an industry. That is exactly what a T Level is built for. Next step: look at which of the five pathways fits you, then register your interest with Amazon."},{minScore:5,heading:"Worth a proper look",text:"Some of this suits you and some of it is still open, which is normal at this stage. Read through the pathways and the questions below, and talk it through with a teacher or careers adviser before you decide."},{minScore:0,heading:"Another route may suit you better",text:"From your answers you lean towards classroom learning and keeping several subjects open, which A levels do well. That is a fine answer. If the placement is the part that appeals, it is still worth reading the pathways below."}],Dv=[{tit
